# https://taskfile.dev

version: "3"

tasks:
  default:
    - go build -o aicode . && ./aicode -config bench/config.yml {{.CLI_ARGS}}

  build:
    - go build -o aicode .

  test:
    - go test ./...

  fmt:
    - go fmt ./...

  lint:
    - go vet ./...

  ch:
    deps: [fmt, lint, test]

  bench:
    - go build -o aicode . && bench/run.sh {{.CLI_ARGS}}

  release:
    - |
      LASTTAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
      MAJOR=$(echo $LASTTAG | cut -d. -f1 | tr -d 'v')
      MINOR=$(echo $LASTTAG | cut -d. -f2)
      PATCH=$(echo $LASTTAG | cut -d. -f3)
      TYPE="{{.CLI_ARGS}}"
      if [ -z "$TYPE" ] || [ "$TYPE" = "minor" ]; then
        NEWTAG="v$MAJOR.$((MINOR + 1)).0"
      elif [ "$TYPE" = "patch" ]; then
        NEWTAG="v$MAJOR.$MINOR.$((PATCH + 1))"
      elif [ "$TYPE" = "major" ]; then
        NEWTAG="v$((MAJOR + 1)).0.0"
      else
        echo "Invalid release type. Use 'minor', 'patch', or 'major'"
        exit 1
      fi
      echo "Last tag: $LASTTAG, New tag: $NEWTAG"
      git tag $NEWTAG
      git push origin master --tags
