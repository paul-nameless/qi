# https://taskfile.dev

version: "3"

tasks:
  default:
    - go build -o qi . && ./qi {{.CLI_ARGS}}

  build:
    - go build -o qi .

  test:
    desc: Run every test uncached; fails when the suite takes 5s or more on this machine
    silent: true
    cmds:
      - |
        now() { perl -MTime::HiRes=time -e 'printf "%d", time * 1000'; }
        go test -run '^$' ./... >/dev/null || exit 1
        start=$(now)
        go test -count=1 ./... || exit 1
        end=$(now)
        if [ -z "$start" ] || [ -z "$end" ]; then
          echo "could not time the tests: perl failed"
          exit 1
        fi
        ms=$(( end - start ))
        echo "tests took ${ms}ms (limit 5000ms)"
        if [ "$ms" -ge 5000 ]; then
          echo "the test suite is over 5s; find the slow tests with: go test -count=1 -v ./... | grep -E -- '--- (PASS|FAIL).*\((0\.[5-9]|[1-9])'"
          exit 1
        fi

  fmt:
    - go fmt ./...

  lint:
    - go vet ./...
    - GOTOOLCHAIN=$(go env GOVERSION) go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run

  ch:
    deps: [fmt, lint]
    cmds:
      - task: test

  release:
    - |
      LASTTAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
      MAJOR=$(echo $LASTTAG | cut -d. -f1 | tr -d 'v')
      MINOR=$(echo $LASTTAG | cut -d. -f2)
      PATCH=$(echo $LASTTAG | cut -d. -f3)
      TYPE="{{.CLI_ARGS}}"
      if [ -z "$TYPE" ] || [ "$TYPE" = "minor" ]; then
        NEWTAG="v$MAJOR.$((MINOR + 1)).0"
      elif [ "$TYPE" = "patch" ]; then
        NEWTAG="v$MAJOR.$MINOR.$((PATCH + 1))"
      elif [ "$TYPE" = "major" ]; then
        NEWTAG="v$((MAJOR + 1)).0.0"
      else
        echo "Invalid release type. Use 'minor', 'patch', or 'major'"
        exit 1
      fi
      echo "Last tag: $LASTTAG, New tag: $NEWTAG"
      git tag $NEWTAG
      git push origin master --tags
