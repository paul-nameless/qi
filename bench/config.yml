providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_shell: "pass show i/openrouter.ai-api-key | head -n 1"
  routeway:
    base_url: https://api.routeway.ai/v1
    api_key_shell: "pass show i/routeway.ai-api-key | head -n 1"
  anthropic-or:
    api: anthropic
    base_url: https://openrouter.ai/api/v1
    api_key_shell: "pass show i/openrouter.ai-api-key | head -n 1"

default_profile: luna

profiles:
  luna:
    provider: openrouter
    model: openai/gpt-6-luna
    reasoning_effort: low
    subagent_models:
      - name: luna
        model: openai/gpt-6-luna
        use_for: fast and cheap; searching, summarizing, simple edits
      - name: haiku
        provider: anthropic-or
        model: anthropic/claude-haiku-5.5
        use_for: fast Claude; reading code and short reviews
  smart:
    provider: openrouter
    model: openai/gpt-6.1-sol
    reasoning_effort: medium
    subagent_models:
      - name: luna
        model: openai/gpt-6-luna
        use_for: fast and cheap; searching, summarizing, simple edits
      - name: terra
        model: openai/gpt-6.1-terra
        use_for: solid mid-tier; focused implementation and reviews
  glm:
    provider: routeway
    model: glm-5.3-flash-uncensored
  haiku:
    provider: anthropic-or
    model: anthropic/claude-haiku-5.5
    reasoning_effort: low

subagent_efforts: [low, medium, high]
